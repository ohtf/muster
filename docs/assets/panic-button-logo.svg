<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Panic Button logo</title>
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0.25" y2="1">
      <stop stop-color="#FF506A"/>
      <stop offset="0.55" stop-color="#E31C3E"/>
      <stop offset="1" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#CDD5E0"/>
      <stop offset="1" stop-color="#8994AA"/>
    </linearGradient>
  </defs>

  <!-- Sticker edge keeps the silhouette legible on light and dark backgrounds. -->
  <g fill="#FFF8F5" stroke="#FFF8F5" stroke-width="16" stroke-linejoin="round">
    <path d="M28 165C28 141 73 122 128 122S228 141 228 165v20c0 24-45 43-100 43S28 209 28 185Z"/>
    <path d="M51 99c0-29 34-52 77-52s77 23 77 52v40c0 25-34 45-77 45s-77-20-77-45Z"/>
  </g>

  <!-- Base and mounting rim. -->
  <g stroke="#291B29" stroke-width="7" stroke-linejoin="round">
    <path fill="#495064" d="M28 165C28 141 73 122 128 122S228 141 228 165v20c0 24-45 43-100 43S28 209 28 185Z"/>
    <ellipse cx="128" cy="165" rx="100" ry="43" fill="url(#rim)"/>
  </g>
  <path d="M68 190c15 6 36 10 60 10s45-4 60-10" fill="none" stroke="#E6EBF2" stroke-width="4" stroke-linecap="round"/>

  <!-- The raised red cap. -->
  <g stroke="#291B29" stroke-width="7" stroke-linejoin="round">
    <path fill="#A10C29" d="M51 99c0-29 34-52 77-52s77 23 77 52v40c0 25-34 45-77 45s-77-20-77-45Z"/>
    <path fill="url(#cap)" d="M51 99c0-29 34-52 77-52s77 23 77 52-34 50-77 50-77-21-77-50Z"/>
  </g>
  <path d="M68 94c3-10 11-18 23-24m-3 84c10 4 23 7 36 7" fill="none" stroke="#FF8D9E" stroke-width="5" stroke-linecap="round"/>

  <!-- Foreshorten the hand to match the elliptical cap (102 high by 154 wide). -->
  <g transform="translate(128 98) scale(1.1 0.73) translate(-123 -101)" fill="#FFF8F5" stroke="#FFF8F5" stroke-linecap="round">
    <path stroke-width="9" d="M112 105V83m12 20V75m12 28V78m12 27V86"/>
    <path stroke-width="10" d="m98 99 17 19"/>
    <path stroke="none" d="M107 101h45.5v8a22.75 22.75 0 0 1-45.5 0Z"/>
  </g>

  <!-- Comic-book motion marks. -->
  <g fill="none" stroke-linecap="round">
    <path d="m57 56-10-11m147-1 6-13m9 24 14-6" stroke="#291B29" stroke-width="12"/>
    <path d="m57 56-10-11m147-1 6-13m9 24 14-6" stroke="#FFB56D" stroke-width="6"/>
  </g>
</svg>
