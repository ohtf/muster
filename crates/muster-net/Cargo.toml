[package]
name = "muster-net"
description = "Muster network I/O drivers: UDP, TCP, mDNS, relay client and interface watch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
if-addrs = "0.15"
mdns-sd = "0.21"
muster-core.workspace = true
muster-proto.workspace = true
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tracing = "0.1"

[target."cfg(unix)".dependencies]
nix = { version = "0.31", features = ["socket", "uio", "net"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
