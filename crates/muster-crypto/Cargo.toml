[package]
name = "muster-crypto"
description = "Muster cryptography: device keys, certificates, sealing, key shares, recovery kits and tokens (no I/O)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6"
blake3 = "1"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
hkdf = "0.13"
muster-proto.workspace = true
sha2 = "0.11"
thiserror = "2"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
proptest = "1"
