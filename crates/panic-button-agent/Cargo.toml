[package]
name = "panic-button-agent"
description = "Panic Button agent runtime: wires core, network, store and platform; control API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme.workspace = true
homepage.workspace = true
keywords = ["panic-alarm", "staff-safety", "healthcare", "lan"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4.3"
jiff = "0.2.44"
panic-button-core.workspace = true
panic-button-crypto.workspace = true
panic-button-net.workspace = true
panic-button-proto.workspace = true
panic-button-store.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal", "fs"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
