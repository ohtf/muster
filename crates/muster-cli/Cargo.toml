[package]
name = "muster-cli"
description = "The muster admin and diagnostics command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "muster"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
muster-agent.workspace = true
muster-core.workspace = true
muster-crypto.workspace = true
muster-proto.workspace = true
muster-store.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
