[package]
name = "panic-button-proto"
description = "Panic Button wire protocol: message types and strict deterministic CBOR encoding (no I/O)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
data-encoding = "2"
minicbor = { version = "2", features = ["alloc"] }
thiserror = "2"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
proptest = "1"
