[package]
name = "panic-button-relay"
description = "Panic Button relay: a blind, multi-tenant forwarder of sealed envelopes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme.workspace = true
homepage.workspace = true
keywords = ["panic-alarm", "staff-safety", "healthcare", "lan"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
panic-button-crypto.workspace = true
panic-button-proto.workspace = true
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30"
