# cargo-deny configuration. Dependencies must be AGPL-compatible
# (spec/adr/0001-licence-agpl-with-app-store-exception.md).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) crates that only the Linux desktop app pulls
# in through Tauri 2: GTK 3 bindings (gtk-rs 0.18) and zbus, used by the
# single-instance plugin. Revisit when Tauri moves to GTK 4 or zbus folds
# these crates in (apps/desktop).
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros 0.18 (Tauri 2 GTK 3 stack)" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 (tauri-plugin-single-instance)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 (tauri-plugin-single-instance)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 (tauri-plugin-single-instance)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  # Permissive, GPL-compatible (used by minicbor).
  "BlueOak-1.0.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # Permissive data licence of the Mozilla root certificate list
  # (webpki-root-certs, via reqwest's rustls-platform-verifier).
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Workspace crates are unpublished (publish = false) and carry the project
# licence with its additional permission; they are not checked here.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
