name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude muster-desktop --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --exclude muster-desktop --all-targets --all-features
      - run: cargo test --workspace --exclude muster-desktop --all-features

  properties:
    name: Simulator properties (256 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --release -p muster-sim --test properties --test scenarios
        env:
          PROPTEST_CASES: "256"

  netns:
    name: Network namespace scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A step timeout ends the step as failed (with logs) rather than
      # cancelling the job, while this build's CI-only hang is investigated.
      - run: cargo build --release -p muster-agent -p muster-cli -p muster-relay
        timeout-minutes: 25
        env:
          CARGO_TERM_PROGRESS_WHEN: never
      - run: sudo --preserve-env=MUSTER_BIN tests/netns/run.sh
        env:
          MUSTER_BIN: ${{ github.workspace }}/target/release

  desktop:
    name: Desktop app (Linux)
    runs-on: ubuntu-latest
    # A cold build of the Tauri stack takes about 30 minutes; the cache
    # brings later runs well under that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and audio development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: s/desktop-check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny
          fallback: none
      - run: cargo deny check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-audit
          fallback: none
      - run: cargo audit

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  workflow-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: zizmor@1.32.0
          fallback: none
      - run: zizmor --strict-collection .
        env:
          GH_TOKEN: ${{ github.token }}

  fuzz-smoke:
    name: Fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up nightly Rust
        shell: bash
        run: rustup toolchain install nightly --profile minimal --no-self-update
      # install-action has no prebuilt cargo-fuzz; build the locked release.
      - name: Install cargo-fuzz
        shell: bash
        run: cargo +nightly install --locked cargo-fuzz@0.13.2
      - name: Run every fuzz target
        shell: bash
        run: |
          for t in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            echo "::group::$t"
            cargo +nightly fuzz run --fuzz-dir fuzz "$t" -- -max_total_time=60
            echo "::endgroup::"
          done
