name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  properties:
    name: Property ${{ matrix.test }} (10,000 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        test:
          - p1_p3_p4_p5_p8_p10_p11_p12_random_worlds
          - p9_clock_skew_up_to_10_minutes
          - p2_p11_attacks
          - p6_revocation
          - p7_bounded_traffic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --release -p muster-sim --test properties -- --exact "$TEST"
        env:
          PROPTEST_CASES: "10000"
          TEST: ${{ matrix.test }}

  full-scale:
    name: S13 at 250 devices
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --release -p muster-sim --test scenarios s13
        env:
          MUSTER_FULL_SCALE: "1"

  fuzz:
    name: Fuzz (1 h per target)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target:
          - envelope_decode
          - signed_message_decode
          - cert_decode_and_validate
          - token_decode
          - relay_frame_decode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up nightly Rust
        shell: bash
        run: rustup toolchain install nightly --profile minimal --no-self-update
      # install-action has no prebuilt cargo-fuzz; build the locked release.
      - name: Install cargo-fuzz
        shell: bash
        run: cargo +nightly install --locked cargo-fuzz@0.13.2
      - run: cargo +nightly fuzz run --fuzz-dir fuzz "$TARGET" -- -max_total_time=3600
        env:
          TARGET: ${{ matrix.target }}
