name: Deep checks

# The slow checks, by hand only (Actions, Deep checks, Run workflow). The
# same checks run locally with s/check-deep, which is the usual way: these
# jobs use about 3 hours of runner time, more with Windows and macOS.

on:
  workflow_dispatch:
    inputs:
      other_os:
        description: Also run the tests on Windows and macOS (macOS costs 10x)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  properties:
    name: Simulator properties (256 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --release -p panic-button-sim --test properties --test scenarios
        env:
          PROPTEST_CASES: "256"

  netns:
    name: Network namespace scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p panic-button-agent -p panic-button -p panic-button-relay
      - run: sudo --preserve-env=PANIC_BUTTON_BIN tests/netns/run.sh
        timeout-minutes: 20
        env:
          PANIC_BUTTON_BIN: ${{ github.workspace }}/target/release

  desktop:
    name: Desktop app (Linux)
    runs-on: ubuntu-latest
    # A cold build of the Tauri stack takes about 30 minutes; the cache
    # brings later runs well under that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and audio development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: s/desktop-check

  fuzz-smoke:
    name: Fuzz smoke (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up nightly Rust
        shell: bash
        run: rustup toolchain install nightly --profile minimal --no-self-update
      # install-action has no prebuilt cargo-fuzz; build the locked release.
      - name: Install cargo-fuzz
        shell: bash
        run: cargo +nightly install --locked cargo-fuzz@0.13.2
      - name: Run every fuzz target
        shell: bash
        run: |
          for t in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            echo "::group::$t"
            cargo +nightly fuzz run --fuzz-dir fuzz "$t" -- -max_total_time=60
            echo "::endgroup::"
          done

  test-other-os:
    name: Test (${{ matrix.os }})
    if: ${{ inputs.other_os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --exclude panic-button-desktop --all-features
