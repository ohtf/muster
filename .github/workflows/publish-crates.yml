# Publishes the panic-button crate (the library and its three programs) to
# crates.io for a release tag. Uses crates.io trusted publishing (OIDC) when
# it is set up, otherwise the CARGO_REGISTRY_TOKEN secret.
#
# Only auto-tag.yml calls it, so the crate needs one trusted publisher entry
# (workflow auto-tag.yml). To retry a failed publish, re-run the failed job
# in that Auto-tag run.
#
# The job runs in the crates-io environment, which only main may deploy to;
# the crate's trusted publisher config names that environment, so crates.io
# issues no token to a run from any other branch.

name: Publish to crates.io

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish.
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        shell: bash
        run: rustup toolchain install --no-self-update
      - name: Test
        run: cargo test --locked --workspace --exclude panic-button-desktop
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
          SECRET_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          export CARGO_REGISTRY_TOKEN="${OIDC_TOKEN:-$SECRET_TOKEN}"
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::No crates.io credentials: set up trusted publishing or the CARGO_REGISTRY_TOKEN secret."
            exit 1
          fi
          cargo publish --locked -p panic-button
