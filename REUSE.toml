version = 1

[[annotations]]
path = ["**/*.md", "spec/**", "safety/**", "docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Open Health Technology Foundation contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["LICENSE", "LICENSES/**", "CODE_OF_CONDUCT.md"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["Cargo.lock", "**/Cargo.lock", ".gitignore", ".editorconfig", ".githooks/**", "s/**", "rust-toolchain.toml", "deny.toml", "cliff.toml", ".gitattributes", ".github/**", "crates/*/tests/vectors/**", "crates/*/tests/*.proptest-regressions", "fuzz/corpus/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Open Health Technology Foundation contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later WITH LicenseRef-Muster-app-store-exception"

[[annotations]]
path = ["sounds/**/*.wav"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Open Health Technology Foundation contributors"
SPDX-License-Identifier = "CC0-1.0"
