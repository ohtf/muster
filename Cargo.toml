[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later WITH LicenseRef-PanicButton-app-store-exception"
repository = "https://github.com/ohtf/panic-button"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.dependencies]
panic-button-proto = { path = "crates/panic-button-proto" }
panic-button-crypto = { path = "crates/panic-button-crypto" }
panic-button-core = { path = "crates/panic-button-core" }
panic-button-store = { path = "crates/panic-button-store" }
panic-button-net = { path = "crates/panic-button-net" }
panic-button-agent = { path = "crates/panic-button-agent" }

# Crypto-heavy tests and the simulator are much faster with optimised
# dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
