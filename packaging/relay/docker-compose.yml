# A relay behind Caddy, which obtains and renews the TLS certificate.
# Edit Caddyfile (host name) and relay.toml, then: docker compose up -d
services:
  relay:
    image: ghcr.io/ohtf/muster-relay:1
    build:
      context: ../..
      dockerfile: packaging/relay/Dockerfile
    restart: unless-stopped
    volumes:
      - ./relay.toml:/etc/muster-relay/relay.toml:ro
      - relay-data:/var/lib/muster-relay
    # Only Caddy talks to the relay; /metrics stays inside this network.
    expose: ["8443"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  relay-data: {}
  caddy-data: {}
